name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ESLint y Prettier se instalan en la raíz y usan la config compartida (eslint.config.mjs, .prettierrc.json).
  repo:
    name: repo (lint + format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run format:check

  # nginx -t y smoke test de HTTPS (redirección, desafío ACME, TLS, HSTS, cambio de certificado) y de
  # los límites de POST /meals, con un stub del Front.
  nginx:
    name: nginx (config + smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash scripts/nginx-smoke.sh

  package:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [shared, app, front-service, back-service]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    # Redis real para los tests de POST /meals (cola de BullMQ); los demás paquetes lo ignoran.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      REDIS_TEST_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            shared/package-lock.json
            ${{ matrix.package }}/package-lock.json

      - name: npm ci (raíz)
        run: npm ci
        working-directory: .
      - run: npm ci
      - run: npm run lint -- --max-warnings 0
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test --if-present
