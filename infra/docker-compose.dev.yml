# Solo para desarrollo: publica MinIO en el host para que la app abra las URLs firmadas.
# Uso: docker compose -f infra/docker-compose.yml -f infra/docker-compose.dev.yml up
# En un teléfono real, usá la IP de la LAN en lugar de 127.0.0.1 acá y en S3_PUBLIC_ENDPOINT.
services:
  minio:
    ports:
      - "127.0.0.1:9000:9000"
    # Docker no publica puertos de redes internal; esta red existe solo para el port mapping.
    networks:
      - interna
      - minio-host

networks:
  minio-host: {}
