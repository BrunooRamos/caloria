# Mongo y Redis nunca están en la red dmz.

services:
  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    networks:
      - dmz
    depends_on:
      - front

  front:
    build: ../front-service
    environment:
      PORT: 3000
      BACKEND_URL: http://back:4000
    networks:
      - dmz
      - interna
    depends_on:
      - back

  back:
    build: ../back-service
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/caloria
      REDIS_URL: redis://redis:6379
    networks:
      - interna
    depends_on:
      - mongo
      - redis

  worker:
    build: ../back-service
    command: ["node", "dist/worker.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/caloria
      REDIS_URL: redis://redis:6379
    networks:
      - interna
    depends_on:
      - mongo
      - redis

  mongo:
    image: mongo:7
    networks:
      - interna

  redis:
    image: redis:7-alpine
    networks:
      - interna

networks:
  dmz: {}
  interna:
    internal: true
