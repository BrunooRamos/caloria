# Solo nginx publica puertos (80 y 443); el resto no es alcanzable desde afuera del host.
# Mongo, Redis y MinIO nunca están en la red dmz; el Front solo llega al Back por la red front-back.
# Las credenciales de MinIO solo llegan a Back y Worker (usuario de servicio) y a minio/minio-init (root).
# La clave de OpenAI solo llega al Worker, el único de la red segura con salida a internet (red
# worker-egress). certbot sale por certbot-egress, donde no hay ningún otro servicio.

x-storage-env: &storage-env
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:?Falta S3_PUBLIC_ENDPOINT}
  S3_REGION: us-east-1
  S3_BUCKET: caloria-media
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?Falta S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?Falta S3_SECRET_ACCESS_KEY}

services:
  # HTTPS: el 80 solo sirve el desafío de Let's Encrypt y redirige; la API va por el 443.
  # Arranca siempre: si no hay certificado de Let's Encrypt usa el temporal de tls-init, y cambia
  # solo al real cuando certbot lo consigue (ver docs/arquitectura.md, "HTTPS y certificados").
  nginx:
    image: nginx:alpine
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN}
      HSTS_MAX_AGE: ${HSTS_MAX_AGE:-300}
      NGINX_ENVSUBST_FILTER: ^(DOMAIN|HSTS_MAX_AGE)$$
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api.conf:/etc/nginx/caloria/api.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/tls.sh:/docker-entrypoint.d/40-caloria-tls.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - tls-bootstrap:/etc/nginx/bootstrap:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - dmz
    depends_on:
      tls-init:
        condition: service_completed_successfully
      front:
        condition: service_started

  # Certificado autofirmado temporal para que nginx arranque sin el de Let's Encrypt. Termina enseguida.
  tls-init:
    image: certbot/certbot:v5.9.0
    entrypoint: ["sh", "/tls-init.sh"]
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN}
    volumes:
      - ./nginx/tls-init.sh:/tls-init.sh:ro
      - tls-bootstrap:/etc/nginx/bootstrap
    network_mode: none

  # Let's Encrypt: pide el certificado y lo renueva. Se activa con COMPOSE_PROFILES=letsencrypt en
  # infra/.env (en el servidor). Solo comparte volúmenes con nginx y su red solo tiene salida.
  certbot:
    image: certbot/certbot:v5.9.0
    profiles: [letsencrypt]
    entrypoint: ["sh", "/certbot.sh"]
    environment:
      DOMAIN: ${DOMAIN:?Falta DOMAIN}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-1}
      ACME_SERVER: ${ACME_SERVER:-}
    volumes:
      - ./certbot/certbot.sh:/certbot.sh:ro
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    networks:
      - certbot-egress
    depends_on:
      - nginx

  # Sin dominio: HTTPS válido con un quick tunnel de Cloudflare (https://<algo>.trycloudflare.com,
  # cambia en cada arranque). Se activa con COMPOSE_PROFILES=tunnel; la URL sale en
  # `docker compose logs tunnel`. Entra por el 443 de nginx y verifica el certificado temporal.
  tunnel:
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - https://nginx:443
      - --origin-server-name
      - ${DOMAIN:?Falta DOMAIN}
      - --origin-ca-pool
      - /etc/nginx/bootstrap/fullchain.pem
    volumes:
      - tls-bootstrap:/etc/nginx/bootstrap:ro
    networks:
      - dmz
    depends_on:
      - nginx

  front:
    build:
      context: ..
      dockerfile: front-service/Dockerfile
    environment:
      PORT: 3000
      BACKEND_URL: http://back:4000
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    networks:
      - dmz
      - front-back
    depends_on:
      - back

  back:
    build:
      context: ..
      dockerfile: back-service/Dockerfile
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/caloria
      REDIS_URL: redis://redis:6379
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
      FREE_MONTHLY_ANALYSES: ${FREE_MONTHLY_ANALYSES:?Falta FREE_MONTHLY_ANALYSES}
      <<: *storage-env
    networks:
      - front-back
      - interna
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ..
      dockerfile: back-service/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/caloria
      REDIS_URL: redis://redis:6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Falta OPENAI_API_KEY}
      OPENAI_VISION_MODEL: ${OPENAI_VISION_MODEL:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-}
      OPENAI_TEXT_MODEL: ${OPENAI_TEXT_MODEL:-}
      OPENAI_COMMENT_MODEL: ${OPENAI_COMMENT_MODEL:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      <<: *storage-env
    networks:
      - interna
      - worker-egress
    depends_on:
      mongo:
        condition: service_started
      redis:
        condition: service_started
      minio-init:
        condition: service_completed_successfully

  mongo:
    image: mongo:7
    networks:
      - interna

  redis:
    image: redis:7-alpine
    networks:
      - interna

  # Las imágenes oficiales minio/minio y minio/mc ya no se publican; se usan las de Chainguard fijadas por digest.
  minio:
    image: cgr.dev/chainguard/minio@sha256:ad134b2dd572ae0d989d6807c3e45516cc75a34883a8021db2ff04be5d1d496a
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    networks:
      - interna

  # Crea el bucket privado y el usuario de servicio; termina y Back/Worker arrancan después.
  minio-init:
    image: cgr.dev/chainguard/minio-client@sha256:a325524e95db52fbd25f68d55b661b232e346c56d0481e99bb0e77315c3e9cb8
    entrypoint: ["sh", "/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: caloria-media
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./minio/init.sh:/init.sh:ro
    networks:
      - interna
    depends_on:
      - minio

volumes:
  minio-data: {}
  # Certificados y claves de Let's Encrypt: persisten entre despliegues y nunca van al repo.
  letsencrypt: {}
  certbot-webroot: {}
  tls-bootstrap: {}

networks:
  dmz: {}
  front-back:
    internal: true
  interna:
    internal: true
  # Salida a internet (API de OpenAI) solo para el Worker; Mongo, Redis y MinIO no están acá.
  worker-egress: {}
  # Salida a Let's Encrypt para certbot, que no ve a ningún otro servicio.
  certbot-egress: {}
