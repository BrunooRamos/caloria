# Las rutas de la API, iguales en el 443 y en el listener HTTP de desarrollo (dev.conf).

location / {
  proxy_pass http://front:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /api/v1/auth/ {
  limit_req zone=auth burst=5 nodelay;
  error_page 429 = @rate_limited;

  proxy_pass http://front:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# POST /meals: foto (≤ 8 MB) + audio (≤ 4 MB) + nota. Los límites finos los aplica el Front.
# El buffer igual al límite deja el body en memoria (con el default pasa a disco arriba de 16 KB).
location = /api/v1/meals {
  client_max_body_size 13m;
  client_body_buffer_size 13m;
  error_page 413 = @payload_too_large;

  proxy_pass http://front:3000;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

# `add_header_inherit merge`: sin esto, un add_header acá descarta los del server (HSTS).
location @payload_too_large {
  add_header_inherit merge;
  default_type application/json;
  add_header X-Request-Id $request_uuid always;
  return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud supera el tamaño permitido","requestId":"$request_uuid"}}';
}

location @rate_limited {
  add_header_inherit merge;
  default_type application/json;
  add_header Retry-After 60 always;
  add_header X-Request-Id $request_uuid always;
  return 429 '{"error":{"code":"RATE_LIMITED","message":"Demasiadas solicitudes","requestId":"$request_uuid"}}';
}
