# Solo desarrollo (lo monta docker-compose.dev.yml): la API por HTTP en el 8080, sin redirigir,
# para Expo Go y los builds de desarrollo, que apuntan a http://localhost:8080. En el servidor no
# existe: ahí el 80 solo redirige y la API va únicamente por el 443.
server {
  listen 8080;

  include /etc/nginx/caloria/api.conf;
}
