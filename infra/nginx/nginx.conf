# Base de nginx. Los server (80, 443 y 8443 del túnel) salen de templates/caloria.conf.template,
# que la imagen oficial procesa al arrancar con DOMAIN y HSTS_MAX_AGE de infra/.env (ver
# docs/arquitectura.md).
events {}

http {
  # Rate limit por IP para /auth: frena fuerza bruta y el costo de bcrypt en el Backend. Detrás del
  # túnel de Cloudflare, $binary_remote_addr ya es la IP del cliente (ver el server del 8443).
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  # Rate limit por IP para toda la API (RNF-07): frena a un cliente que manda pedidos en ráfaga.
  # La app real hace pocos por segundo; el burst cubre una pantalla que carga varias cosas juntas.
  limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
  # Subir fotos (POST /meals) es lo que dispara la IA: más estricto. Con clave vacía nginx no
  # cuenta, así que GET /meals (el historial) queda solo con el límite general.
  map $request_method $meals_upload_key {
    POST $binary_remote_addr;
    default "";
  }
  limit_req_zone $meals_upload_key zone=meals:10m rate=20r/m;
  limit_req_status 429;
  limit_req_log_level warn;

  # $request_id (32 hex) con forma de UUID, para que el sobre de error tenga un requestId válido.
  map $request_id $request_uuid {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
  }

  # TLS: perfil "intermediate" de Mozilla (guía 6.0): solo TLS 1.2 y 1.3, cifrados AEAD con
  # intercambio de claves efímero, y el orden de cifrados lo elige el cliente.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;
  # Sin OCSP stapling: Let's Encrypt dejó de publicar OCSP en 2025.

  include /etc/nginx/conf.d/caloria*.conf;
}
