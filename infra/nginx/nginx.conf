# En producción se agrega TLS en el 443.
events {}

http {
  # Rate limit por IP para /auth: frena fuerza bruta y el costo de bcrypt en el Backend.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
  limit_req_status 429;

  # $request_id (32 hex) con forma de UUID, para que el sobre de error tenga un requestId válido.
  map $request_id $request_uuid {
    "~^(?<a>.{8})(?<b>.{4})(?<c>.{4})(?<d>.{4})(?<e>.{12})$" "$a-$b-$c-$d-$e";
  }

  server {
    listen 80;

    location / {
      proxy_pass http://front:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      error_page 429 = @rate_limited;

      proxy_pass http://front:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # POST /meals: foto (≤ 8 MB) + audio (≤ 4 MB) + nota. Los límites finos los aplica el Front.
    location = /api/v1/meals {
      client_max_body_size 13m;
      error_page 413 = @payload_too_large;

      proxy_pass http://front:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location @payload_too_large {
      default_type application/json;
      add_header X-Request-Id $request_uuid always;
      return 413 '{"error":{"code":"PAYLOAD_TOO_LARGE","message":"La solicitud supera el tamaño permitido","requestId":"$request_uuid"}}';
    }

    location @rate_limited {
      default_type application/json;
      add_header Retry-After 60 always;
      add_header X-Request-Id $request_uuid always;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Demasiadas solicitudes","requestId":"$request_uuid"}}';
    }
  }
}
